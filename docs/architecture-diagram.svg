<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'DM Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#7c6dfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#0c0c14" rx="12"/>

  <!-- Grid lines subtle -->
  <g opacity="0.04" stroke="#7c6dfa" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
  </g>

  <!-- Title -->
  <text x="24" y="30" fill="#7c6dfa" font-size="10" letter-spacing="2" opacity="0.7">SYSTEM ARCHITECTURE</text>
  <text x="680" y="30" fill="#4b5563" font-size="10" letter-spacing="1">AI RESUME ANALYZER</text>

  <!-- ── User ── -->
  <rect x="24" y="50" width="100" height="48" rx="8" fill="#1a1a2e" stroke="#374151" stroke-width="1"/>
  <text x="74" y="70" fill="#9ca3af" font-size="10" text-anchor="middle">USER</text>
  <text x="74" y="86" fill="#6b7280" font-size="9" text-anchor="middle">PDF + JD</text>

  <!-- ── Frontend ── -->
  <rect x="172" y="50" width="130" height="48" rx="8" fill="#1a1a2e" stroke="#7c6dfa" stroke-width="1"/>
  <text x="237" y="70" fill="#a78bfa" font-size="10" text-anchor="middle" font-weight="bold">FRONTEND</text>
  <text x="237" y="85" fill="#6b7280" font-size="9" text-anchor="middle">React + Vite / nginx</text>

  <!-- User → Frontend -->
  <line x1="124" y1="74" x2="170" y2="74" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── FastAPI Backend box ── -->
  <rect x="355" y="40" width="290" height="420" rx="10" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="500" y="58" fill="#4b5563" font-size="9" text-anchor="middle" letter-spacing="1">FastAPI BACKEND</text>

  <!-- Frontend → Backend -->
  <line x1="302" y1="74" x2="370" y2="74" stroke="#7c6dfa" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="336" y="68" fill="#7c6dfa" font-size="8" text-anchor="middle">HTTP</text>

  <!-- ── API Layer ── -->
  <rect x="371" y="68" width="258" height="44" rx="6" fill="#16162a" stroke="#4b5563" stroke-width="1"/>
  <text x="500" y="85" fill="#d1d5db" font-size="10" text-anchor="middle" font-weight="bold">api/analyse.py</text>
  <text x="500" y="100" fill="#6b7280" font-size="8" text-anchor="middle">validate · rate-limit · dispatch</text>

  <!-- ── Preprocessor ── -->
  <rect x="371" y="130" width="258" height="36" rx="6" fill="#16162a" stroke="#4b5563" stroke-width="1"/>
  <text x="500" y="147" fill="#d1d5db" font-size="10" text-anchor="middle">preprocessor.py</text>
  <text x="500" y="159" fill="#6b7280" font-size="8" text-anchor="middle">encoding · whitespace · truncate</text>

  <!-- API → Preprocessor -->
  <line x1="500" y1="112" x2="500" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── asyncio.gather label ── -->
  <text x="500" y="184" fill="#7c6dfa" font-size="8" text-anchor="middle" letter-spacing="1">asyncio.gather() — concurrent</text>
  <line x1="410" y1="188" x2="590" y2="188" stroke="#7c6dfa" stroke-width="0.5" opacity="0.4"/>

  <!-- ── LLM Scorer ── -->
  <rect x="371" y="196" width="118" height="76" rx="6" fill="#16162a" stroke="#7c6dfa" stroke-width="1"/>
  <text x="430" y="213" fill="#a78bfa" font-size="9" text-anchor="middle" font-weight="bold">scorer.py</text>
  <text x="430" y="227" fill="#6b7280" font-size="8" text-anchor="middle">LangChain chain</text>
  <text x="430" y="240" fill="#6b7280" font-size="8" text-anchor="middle">v1 / v2 / v3 prompts</text>
  <text x="430" y="253" fill="#6b7280" font-size="8" text-anchor="middle">retry ×3</text>
  <text x="430" y="266" fill="#6b7280" font-size="8" text-anchor="middle">repair.py</text>

  <!-- ── FAISS Scorer ── -->
  <rect x="511" y="196" width="118" height="76" rx="6" fill="#16162a" stroke="#22d3ee" stroke-width="1"/>
  <text x="570" y="213" fill="#22d3ee" font-size="9" text-anchor="middle" font-weight="bold">embeddings.py</text>
  <text x="570" y="227" fill="#6b7280" font-size="8" text-anchor="middle">MiniLM-L6-v2</text>
  <text x="570" y="240" fill="#6b7280" font-size="8" text-anchor="middle">FAISS FlatIP</text>
  <text x="570" y="253" fill="#6b7280" font-size="8" text-anchor="middle">cosine top-5</text>
  <text x="570" y="266" fill="#6b7280" font-size="8" text-anchor="middle">divergence check</text>

  <!-- Preprocessor → both scorers -->
  <line x1="430" y1="166" x2="430" y2="194" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="174" x2="570" y2="194" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Pydantic Validation ── -->
  <rect x="371" y="292" width="258" height="36" rx="6" fill="#16162a" stroke="#34d399" stroke-width="1"/>
  <text x="500" y="309" fill="#34d399" font-size="10" text-anchor="middle">schemas.py (Pydantic)</text>
  <text x="500" y="321" fill="#6b7280" font-size="8" text-anchor="middle">MatchReport · SemanticResult · AnalysisResponse</text>

  <!-- Scorers → Pydantic -->
  <line x1="430" y1="272" x2="430" y2="290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="272" x2="570" y2="290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="292" x2="500" y2="292" stroke="#4b5563" stroke-width="1"/>

  <!-- ── Persist / Track row ── -->
  <rect x="371" y="350" width="118" height="48" rx="6" fill="#16162a" stroke="#fbbf24" stroke-width="1"/>
  <text x="430" y="368" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">database.py</text>
  <text x="430" y="381" fill="#6b7280" font-size="8" text-anchor="middle">SQLite · run history</text>
  <text x="430" y="393" fill="#6b7280" font-size="8" text-anchor="middle">AnalysisRun</text>

  <rect x="511" y="350" width="118" height="48" rx="6" fill="#16162a" stroke="#f87171" stroke-width="1"/>
  <text x="570" y="368" fill="#f87171" font-size="9" text-anchor="middle" font-weight="bold">tracker.py</text>
  <text x="570" y="381" fill="#6b7280" font-size="8" text-anchor="middle">MLflow · metrics</text>
  <text x="570" y="393" fill="#6b7280" font-size="8" text-anchor="middle">prompt versioning</text>

  <!-- Pydantic → persist/track -->
  <line x1="430" y1="328" x2="430" y2="348" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="336" x2="570" y2="348" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── External services ── -->
  <!-- Ollama -->
  <rect x="24" y="200" width="100" height="48" rx="8" fill="#1a1a2e" stroke="#4b5563" stroke-width="1"/>
  <text x="74" y="220" fill="#9ca3af" font-size="10" text-anchor="middle">OLLAMA</text>
  <text x="74" y="235" fill="#6b7280" font-size="9" text-anchor="middle">Mistral 7B</text>
  <text x="74" y="248" fill="#6b7280" font-size="8" text-anchor="middle">:11434</text>

  <!-- scorer → ollama -->
  <line x1="371" y1="230" x2="126" y2="225" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="248" y="218" fill="#4b5563" font-size="8" text-anchor="middle">LLM call</text>

  <!-- MLflow UI -->
  <rect x="24" y="350" width="100" height="48" rx="8" fill="#1a1a2e" stroke="#4b5563" stroke-width="1"/>
  <text x="74" y="370" fill="#9ca3af" font-size="10" text-anchor="middle">MLFLOW UI</text>
  <text x="74" y="385" fill="#6b7280" font-size="9" text-anchor="middle">:5000</text>
  <text x="74" y="398" fill="#6b7280" font-size="8" text-anchor="middle">experiments</text>

  <!-- tracker → mlflow -->
  <line x1="371" y1="374" x2="126" y2="374" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="248" y="367" fill="#4b5563" font-size="8" text-anchor="middle">HTTP log</text>

  <!-- ── Evaluation box ── -->
  <rect x="24" y="450" width="652" height="52" rx="8" fill="#16162a" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="350" y="468" fill="#6b7280" font-size="9" text-anchor="middle" letter-spacing="1">EVALUATION FRAMEWORK (offline)</text>
  <text x="350" y="485" fill="#4b5563" font-size="8" text-anchor="middle">ground_truth.json (20 pairs) → evaluate.py → metrics.py (MAE · within-10% · tier F1 · Pearson r) → MLflow eval experiment</text>

  <!-- ── Legend ── -->
  <rect x="695" y="200" width="90" height="100" rx="6" fill="#13131f" stroke="#374151" stroke-width="1"/>
  <text x="705" y="216" fill="#6b7280" font-size="8">LEGEND</text>
  <line x1="705" y1="228" x2="730" y2="228" stroke="#7c6dfa" stroke-width="1.5"/>
  <text x="735" y="232" fill="#6b7280" font-size="8">HTTP call</text>
  <line x1="705" y1="244" x2="730" y2="244" stroke="#4b5563" stroke-width="1.5"/>
  <text x="735" y="248" fill="#6b7280" font-size="8">internal</text>
  <line x1="705" y1="260" x2="730" y2="260" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="735" y="264" fill="#6b7280" font-size="8">network</text>
  <rect x="705" y="274" width="12" height="8" rx="2" fill="none" stroke="#7c6dfa" stroke-width="1"/>
  <text x="721" y="282" fill="#6b7280" font-size="8">LLM</text>
  <rect x="705" y="287" width="12" height="8" rx="2" fill="none" stroke="#22d3ee" stroke-width="1"/>
  <text x="721" y="295" fill="#6b7280" font-size="8">FAISS</text>
</svg>
